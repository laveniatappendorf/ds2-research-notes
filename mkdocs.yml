site_name: Dark Souls II Research Notes
site_description: Working notes from taking Dark Souls II apart - the 2013 Network Test, retail builds, patches and PC. Unofficial research, not a guide.
site_url: https://laveniatappendorf.github.io/ds2-research-notes/
repo_url: https://github.com/laveniatappendorf/ds2-research-notes
docs_dir: docs
strict: false

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

